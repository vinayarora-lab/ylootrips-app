name: ylootrips
description: YlooTrips - Luxury India Travel App
publish_to: 'none'
version: 1.5.0+324

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # HTTP
  http: ^1.2.1

  # WebView for Easebuzz payment
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0

  # Images
  cached_network_image: ^3.3.1

  # Storage
  shared_preferences: ^2.2.3

  # URL launcher (WhatsApp, deep links)
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0

  # Fonts
  google_fonts: ^6.2.1

  # UI utilities
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Icons
  font_awesome_flutter: ^10.7.0

  # Video
  video_player: ^2.9.2

  # Misc
  flutter_svg: ^2.0.10+1
  share_plus: ^9.0.0

  # Firebase Analytics
  firebase_core: ">=3.0.0 <3.5.0"
  firebase_analytics: ">=11.0.0 <11.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
